<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50-годишен юбилей - С обич и благодарност</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f7f5ef;
            font-family: 'Montserrat', sans-serif;
            color: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            background: #fffdf9;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(74, 53, 90, 0.08);
            border: 1px solid #e6ded1;
            padding: 32px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        /* Gold frame styling */
        .card::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0.6;
        }
        .header-flowers {
            width: 160px;
            margin: 0 auto 16px auto;
            display: block;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 600;
            color: #4a355a;
            margin-bottom: 24px;
            line-height: 1.3;
        }
        .message {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 18px;
            line-height: 1.6;
            color: #3a3a3a;
            margin-bottom: 28px;
            padding: 0 10px;
        }
        .heart {
            color: #d4af37;
            font-size: 20px;
            margin-bottom: 12px;
            display: block;
        }
        .signature {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 600;
            color: #4a355a;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Violet watercolor header graphic representation -->
        <svg class="header-flowers" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
            <!-- Simplified elegant violet blossoms and leaves cluster -->
            <path d="M150,20 C130,10 100,30 110,50 C90,40 70,60 85,80 C70,90 90,110 110,100 C120,115 150,110 150,95 C150,110 180,115 190,100 C210,110 230,90 215,80 C230,60 210,40 190,50 C200,30 170,10 150,20 Z" fill="#eef2eb" stroke="#a3b19b" stroke-width="1.5"/>
            <!-- Violets -->
            <circle cx="150" cy="55" r="16" fill="#8b5cf6" opacity="0.85"/>
            <circle cx="125" cy="65" r="14" fill="#7c3aed" opacity="0.85"/>
            <circle cx="175" cy="65" r="14" fill="#7c3aed" opacity="0.85"/>
            <circle cx="140" cy="80" r="13" fill="#9333ea" opacity="0.85"/>
            <circle cx="160" cy="80" r="13" fill="#9333ea" opacity="0.85"/>
            <circle cx="150" cy="68" r="4" fill="#fde047"/>
            <circle cx="125" cy="75" r="3" fill="#fde047"/>
            <circle cx="175" cy="75" r="3" fill="#fde047"/>
        </svg>

        <h1>Благодарим Ви, че сканирахте!</h1>
        
        <div class="message">
            „Истинското щастие е да бъдеш споделен. Благодаря ви, че сте част от моя 50-годишен юбилей и от моя живот! Наздраве за хубавите моменти!“
        </div>

        <span class="heart">♥</span>
        
        <div class="signature">
            С обич и благодарност!
        </div>
    </div>

</body>
</html>
