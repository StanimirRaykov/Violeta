<!DOCTYPE html>
<html lang="bg" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50-годишен юбилей - Наздраве!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playfair Display for elegant serif typography & Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Cormorant Garamond', serif;
        }

        .serif-title {
            font-family: 'Playfair Display', serif;
        }

        /* Vintage parchment background texture look */
        .parchment-bg {
            background-color: #FBF9F5;
            background-image: radial-gradient(#F3EFE6 1px, transparent 1px), radial-gradient(#F3EFE6 1px, #FBF9F5 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        /* Custom golden gradient for frames and accents */
        .gold-gradient {
            background: linear-gradient(135deg, #C5A059 0%, #E6C687 50%, #A37E39 100%);
        }

        .gold-text-gradient {
            background: linear-gradient(135deg, #8E6F32 0%, #C5A059 50%, #8E6F32 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="parchment-bg min-h-full flex items-center justify-center p-4 sm:p-6 text-neutral-800">

    <!-- Main Card Container -->
    <main
        class="w-full max-w-md mx-auto bg-white/90 backdrop-blur-sm rounded-2xl shadow-2xl overflow-hidden border-2 border-[#D4AF37]/50 relative transition-all duration-300">

        <!-- Top Ornate Golden Border & Watercolor Violets Header -->
        <header class="relative pt-8 pb-4 px-6 text-center bg-gradient-to-b from-[#F9F6F0] to-transparent">

            <!-- Corner Golden Filigrees (SVGs) -->
            <div class="absolute top-2 left-2 text-[#C5A059] pointer-events-none opacity-80">
                <svg width="40" height="40" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 2H20C20 2 2 15 2 25V2Z" fill="currentColor" />
                    <path d="M2 2V20C20 20 2 2 2 2Z" fill="currentColor" />
                    <path d="M4 4C15 4 25 10 25 25C25 15 35 15 40 4C30 4 25 2 4 4Z" stroke="currentColor"
                        stroke-width="1.5" fill="none" />
                </svg>
            </div>
            <div class="absolute top-2 right-2 text-[#C5A059] pointer-events-none opacity-80 transform scale-x-[-1]">
                <svg width="40" height="40" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 2H20C20 2 2 15 2 25V2Z" fill="currentColor" />
                    <path d="M2 2V20C20 20 2 2 2 2Z" fill="currentColor" />
                    <path d="M4 4C15 4 25 10 25 25C25 15 35 15 40 4C30 4 25 2 4 4Z" stroke="currentColor"
                        stroke-width="1.5" fill="none" />
                </svg>
            </div>

            <!-- Watercolor Purple Violets Illustration (SVG Bouquet) -->
            <div class="w-48 h-28 mx-auto mb-2 flex items-center justify-center">
                <svg viewBox="0 0 200 120" class="w-full h-full drop-shadow-sm" xmlns="http://www.w3.org/2000/svg">
                    <!-- Leaves -->
                    <path d="M70,95 Q50,80 35,90 Q50,110 70,95 Z" fill="#6B8E56" opacity="0.9" />
                    <path d="M130,95 Q150,80 165,90 Q150,110 130,95 Z" fill="#6B8E56" opacity="0.9" />
                    <path d="M50,100 Q30,105 20,95 Q35,80 50,100 Z" fill="#5A7A46" opacity="0.8" />
                    <path d="M150,100 Q170,105 180,95 Q165,80 150,100 Z" fill="#5A7A46" opacity="0.8" />
                    <path d="M85,105 Q100,115 115,105 Q100,90 85,105 Z" fill="#7FA366" opacity="0.9" />

                    <!-- Violet 1 (Center Top) -->
                    <g transform="translate(100,45)">
                        <circle cx="0" cy="0" r="14" fill="#8B63B6" />
                        <ellipse cx="0" cy="-10" rx="6" ry="9" fill="#A881DF" />
                        <ellipse cx="9" cy="-3" rx="7" ry="8" fill="#9B71CE" transform="rotate(45 9 -3)" />
                        <ellipse cx="-9" cy="-3" rx="7" ry="8" fill="#9B71CE" transform="rotate(-45 -9 -3)" />
                        <ellipse cx="6" cy="7" rx="6" ry="8" fill="#7D51A8" transform="rotate(75 6 7)" />
                        <ellipse cx="-6" cy="7" rx="6" ry="8" fill="#7D51A8" transform="rotate(-75 -6 7)" />
                        <circle cx="0" cy="0" r="3" fill="#F4D03F" />
                    </g>

                    <!-- Violet 2 (Left) -->
                    <g transform="translate(70,55) scale(0.85)">
                        <circle cx="0" cy="0" r="14" fill="#7D51A8" />
                        <ellipse cx="0" cy="-10" rx="6" ry="9" fill="#9B71CE" />
                        <ellipse cx="9" cy="-3" rx="7" ry="8" fill="#8B63B6" transform="rotate(45 9 -3)" />
                        <ellipse cx="-9" cy="-3" rx="7" ry="8" fill="#8B63B6" transform="rotate(-45 -9 -3)" />
                        <circle cx="0" cy="0" r="3" fill="#F4D03F" />
                    </g>

                    <!-- Violet 3 (Right) -->
                    <g transform="translate(130,55) scale(0.85)">
                        <circle cx="0" cy="0" r="14" fill="#7D51A8" />
                        <ellipse cx="0" cy="-10" rx="6" ry="9" fill="#9B71CE" />
                        <ellipse cx="9" cy="-3" rx="7" ry="8" fill="#8B63B6" transform="rotate(45 9 -3)" />
                        <ellipse cx="-9" cy="-3" rx="7" ry="8" fill="#8B63B6" transform="rotate(-45 -9 -3)" />
                        <circle cx="0" cy="0" r="3" fill="#F4D03F" />
                    </g>

                    <!-- Violet 4 (Outer Left) -->
                    <g transform="translate(45,70) scale(0.7)">
                        <circle cx="0" cy="0" r="14" fill="#9B71CE" />
                        <ellipse cx="0" cy="-10" rx="6" ry="9" fill="#B894E8" />
                        <circle cx="0" cy="0" r="3" fill="#F4D03F" />
                    </g>

                    <!-- Violet 5 (Outer Right) -->
                    <g transform="translate(155,70) scale(0.7)">
                        <circle cx="0" cy="0" r="14" fill="#9B71CE" />
                        <ellipse cx="0" cy="-10" rx="6" ry="9" fill="#B894E8" />
                        <circle cx="0" cy="0" r="3" fill="#F4D03F" />
                    </g>

                    <!-- Small Buds -->
                    <circle cx="28" cy="85" r="4" fill="#B894E8" />
                    <circle cx="172" cy="85" r="4" fill="#B894E8" />
                </svg>
            </div>

            <!-- Main Heading -->
            <h1 class="serif-title text-2xl sm:text-3xl font-bold tracking-wide text-[#5A3E1B] mt-1">
                Благодарим Ви,<br>че сканирахте!
            </h1>
        </header>

        <!-- Content Body -->
        <div class="px-8 pb-8 pt-2 text-center space-y-6">

            <!-- Golden Divider Line -->
            <div class="flex items-center justify-center my-4">
                <div class="h-[1px] w-16 gold-gradient opacity-60"></div>
                <div class="mx-3 text-[#C5A059] text-sm">✦</div>
                <div class="h-[1px] w-16 gold-gradient opacity-60"></div>
            </div>

            <!-- Message Paragraphs -->
            <div class="space-y-4 text-lg sm:text-xl text-[#3A3226] leading-relaxed font-normal">
                <p class="italic font-medium text-[#4A3B2C]">
                    „Истинското щастие е да бъдеш споделен.“
                </p>
                <p>
                    Благодаря ви, че сте част от моя 50-годишен юбилей и от моя живот!
                </p>
                <p class="font-semibold text-[#5A3E1B]">
                    Наздраве за хубавите моменти!
                </p>
            </div>

            <!-- Centered Gold Heart Element -->
            <div class="py-2 flex justify-center items-center">
                <div
                    class="w-10 h-10 rounded-full bg-[#FAF6EE] border border-[#D4AF37]/40 flex items-center justify-center shadow-sm">
                    <svg class="w-5 h-5 text-[#C5A059] fill-current animate-pulse" viewBox="0 0 24 24">
                        <path
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                    </svg>
                </div>
            </div>

            <!-- Closing Sign-off -->
            <div class="pt-2">
                <p class="serif-title italic text-xl text-[#7B5829] font-medium tracking-wide">
                    С обич и благодарност!
                </p>
            </div>
        </div>

        <!-- Bottom Ornate Frame Corners -->
        <div class="absolute bottom-2 left-2 text-[#C5A059] pointer-events-none opacity-80 transform scale-y-[-1]">
            <svg width="40" height="40" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 2H20C20 2 2 15 2 25V2Z" fill="currentColor" />
                <path d="M2 2V20C20 20 2 2 2 2Z" fill="currentColor" />
                <path d="M4 4C15 4 25 10 25 25C25 15 35 15 40 4C30 4 25 2 4 4Z" stroke="currentColor" stroke-width="1.5"
                    fill="none" />
            </svg>
        </div>
        <div class="absolute bottom-2 right-2 text-[#C5A059] pointer-events-none opacity-80 transform scale-[-1]">
            <svg width="40" height="40" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 2H20C20 2 2 15 2 25V2Z" fill="currentColor" />
                <path d="M2 2V20C20 20 2 2 2 2Z" fill="currentColor" />
                <path d="M4 4C15 4 25 10 25 25C25 15 35 15 40 4C30 4 25 2 4 4Z" stroke="currentColor" stroke-width="1.5"
                    fill="none" />
            </svg>
        </div>
    </main>

</body>

</html>
